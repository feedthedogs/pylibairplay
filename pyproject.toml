[project]
name = "pylibairplay"
version = "0.1.1"
description = "AirPlay screen-mirroring receiver in pure Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "feedthedogs" }
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/feedthedogs/pylibairplay"
Issues = "https://github.com/feedthedogs/pylibairplay/issues"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# Runtime deps are added as milestones land. mDNS + crypto for discovery/pairing.
net = ["zeroconf>=0.132", "cryptography>=43"]
# Runs the FairPlay emulator (pylibairplay/fp_emu.py) in this same interpreter.
fairplay = ["unicorn>=2", "lief>=0.14", "capstone>=5"]

[dependency-groups]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pylibairplay = "pylibairplay.receiver:_main"
